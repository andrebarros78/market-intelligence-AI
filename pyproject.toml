[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-ai"
version = "0.12.0"
description = "Nucleo limpo do Market Intelligence IA"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "temporalio==1.31.0",
  "cryptography==50.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "postgres: requires TEST_DATABASE_URL pointing to PostgreSQL",
  "temporal: requires the Temporal SDK test environment",
]

[tool.ruff]
target-version = "py312"
line-length = 100
