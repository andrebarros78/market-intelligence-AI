[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-ai"
version = "0.2.0"
description = "Nucleo limpo do Market Intelligence IA"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires TEST_DATABASE_URL pointing to PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100
