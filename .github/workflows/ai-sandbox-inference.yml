name: AI Sandbox Inference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-sandbox-inference.yml'
      - 'src/market_intelligence/ai/providers.py'
      - 'src/market_intelligence/ai/vault.py'
      - 'scripts/sandbox_ai_inference.py'

permissions:
  contents: read

jobs:
  system-gpt-sandbox:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: INTELIGENCI DE MERCADO API
    env:
      MI_AI_SYSTEM_PROFILE: '1'
      MI_AI_PROFILE_1_ENABLED: 'true'
      MI_AI_PROFILE_1_NAME: System GPT
      MI_AI_PROFILE_1_PROVIDER: openai
      MI_AI_PROFILE_1_MODEL: gpt-5-mini
      MI_AI_PROFILE_1_BASE_URL: https://api.openai.com/v1
      MI_AI_PROFILE_1_PROTOCOL: openai-compatible
      MI_AI_PROFILE_1_AUTH_TYPE: api_key
      MI_AI_PROFILE_1_API_KEY: ${{ secrets.MI_AI_SYSTEM_API_KEY }}
      MI_AI_PROFILE_1_MAX_OUTPUT_TOKENS: '128'
      MI_AI_PROFILE_1_RETRIES: '0'
      MI_AI_PROFILE_1_TIMEOUT_SECONDS: '20'
      MI_AI_PROFILE_1_STORE: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: One fixed synthetic GPT inference
        run: python scripts/sandbox_ai_inference.py --role system

  agents-zai-sandbox:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[IA-SANDBOX-RUN]')
    concurrency:
      group: api-ml-zai-external-agent-gate
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: INTELIGENCI DE MERCADO API
    env:
      MI_AI_AGENTS_PROFILE: '2'
      MI_AI_PROFILE_2_ENABLED: 'true'
      MI_AI_PROFILE_2_NAME: Agents GLM-4.7-Flash
      MI_AI_PROFILE_2_PROVIDER: zai
      MI_AI_PROFILE_2_MODEL: glm-4.7-flash
      MI_AI_PROFILE_2_BASE_URL: https://api.z.ai/api/paas/v4
      MI_AI_PROFILE_2_PROTOCOL: openai-compatible
      MI_AI_PROFILE_2_AUTH_TYPE: api_key
      MI_AI_PROFILE_2_API_KEY: ${{ secrets.MI_AI_AGENTS_API_KEY }}
      MI_AI_PROFILE_2_MAX_OUTPUT_TOKENS: '64'
      MI_AI_PROFILE_2_RETRIES: '0'
      MI_AI_PROFILE_2_TIMEOUT_SECONDS: '20'
      MI_AI_PROFILE_2_STORE: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: One fixed synthetic GLM-4.7-Flash inference
        run: python scripts/sandbox_ai_inference.py --role agents
