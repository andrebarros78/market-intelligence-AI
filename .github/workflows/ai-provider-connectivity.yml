name: AI Provider Connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-provider-connectivity.yml'
      - 'src/market_intelligence/ai/**'
      - 'scripts/probe_ai_provider.py'

permissions:
  contents: read

jobs:
  system-gpt:
    runs-on: ubuntu-latest
    environment: INTELIGENCI DE MERCADO API
    env:
      MI_AI_SYSTEM_PROFILE: '1'
      MI_AI_PROFILE_1_ENABLED: 'true'
      MI_AI_PROFILE_1_NAME: System GPT
      MI_AI_PROFILE_1_PROVIDER: openai
      MI_AI_PROFILE_1_MODEL: gpt-5-mini
      MI_AI_PROFILE_1_BASE_URL: https://api.openai.com/v1
      MI_AI_PROFILE_1_PROTOCOL: openai-compatible
      MI_AI_PROFILE_1_AUTH_TYPE: api_key
      MI_AI_PROFILE_1_API_KEY: ${{ secrets.MI_AI_SYSTEM_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe profile 1 GPT system without inference or business data
        run: python scripts/probe_ai_provider.py --role system

  agents-zai:
    runs-on: ubuntu-latest
    environment: INTELIGENCI DE MERCADO API
    env:
      MI_AI_AGENTS_PROFILE: '2'
      MI_AI_PROFILE_2_ENABLED: 'true'
      MI_AI_PROFILE_2_NAME: Agents GLM
      MI_AI_PROFILE_2_PROVIDER: zai
      MI_AI_PROFILE_2_MODEL: glm-5.1
      MI_AI_PROFILE_2_BASE_URL: https://api.z.ai/api/paas/v4
      MI_AI_PROFILE_2_PROTOCOL: openai-compatible
      MI_AI_PROFILE_2_AUTH_TYPE: api_key
      MI_AI_PROFILE_2_API_KEY: ${{ secrets.MI_AI_AGENTS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe profile 2 Z.AI agents without inference or business data
        run: python scripts/probe_ai_provider.py --role agents
