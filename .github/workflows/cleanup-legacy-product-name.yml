name: Cleanup Legacy Product Name

on:
  push:
    branches:
      - cleanup/remove-api-ml-legacy
    paths:
      - '.github/workflows/cleanup-legacy-product-name.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/remove-api-ml-legacy
          fetch-depth: 0

      - name: Remove obsolete recovery-only material and normalize active naming
        shell: python
        run: |
          from pathlib import Path
          import shutil

          root = Path('.')
          obsolete = [
              Path('docs/LOCAL-COLLECTION-AND-IMPORT.md'),
              Path('docs/recovery'),
              Path('tools/Collect-Git-Recovery-Evidence-v2.ps1'),
              Path('tools/Collect-Git-Recovery-Evidence.ps1'),
              Path('tools/Collect-Local-MarketIntelligence.ps1'),
              Path('tools/Export-Dangling-Blobs-Safe.ps1'),
              Path('tools/Recover-Local-MarketIntelligence.ps1'),
          ]
          for path in obsolete:
              if path.is_dir():
                  shutil.rmtree(path)
              elif path.exists():
                  path.unlink()

          replacements = (
              ('API' + ' ML', 'Market Intelligence AI'),
              ('API' + '-ML', 'Market-Intelligence-AI'),
              ('API' + '_ML', 'MARKET_INTELLIGENCE_AI'),
              ('api' + ' ml', 'market intelligence ai'),
              ('api' + '-ml', 'market-intelligence'),
              ('api' + '_ml', 'market_intelligence'),
          )
          suffixes = {'.md', '.py', '.toml', '.yml', '.yaml', '.json', '.ini', '.txt', '.ps1', '.sh'}
          changed = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new_text = text
              for old, new in replacements:
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          # One-shot workflow: remove itself from the resulting tree.
          workflow = Path('.github/workflows/cleanup-legacy-product-name.yml')
          if workflow.exists():
              workflow.unlink()

          print('NORMALIZED_FILES=' + str(len(changed)))
          for item in changed:
              print(item)

      - name: Prove legacy name is absent
        shell: python
        run: |
          from pathlib import Path
          patterns = (
              'API' + ' ML', 'API' + '-ML', 'API' + '_ML',
              'api' + ' ml', 'api' + '-ml', 'api' + '_ml',
          )
          suffixes = {'.md', '.py', '.toml', '.yml', '.yaml', '.json', '.ini', '.txt', '.ps1', '.sh'}
          findings = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), start=1):
                  if any(pattern in line for pattern in patterns):
                      findings.append(f'{path}:{number}: {line.strip()}')
          if findings:
              raise SystemExit('LEGACY_NAME_REMAINS\n' + '\n'.join(findings))
          print('LEGACY_PRODUCT_NAME_COUNT=0')

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "cleanup: remover nomenclatura legada do produto"
          git push origin HEAD:cleanup/remove-api-ml-legacy
