name: Validate Market Intelligence Base

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d market_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/market_intelligence_test
      MI_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/market_intelligence_test
      MI_READ_ONLY: "true"
      MI_ALLOW_MARKETPLACE_WRITES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests migrations
      - name: Migrate PostgreSQL
        run: alembic upgrade head
      - name: Validate migration drift
        run: alembic check
      - name: Validate migration rollback
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Test
        run: pytest -q
