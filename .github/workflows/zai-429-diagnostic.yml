name: ZAI 429 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zai-429-diagnostic.yml'
      - 'scripts/diagnose_zai_429.py'

permissions:
  contents: read

jobs:
  diagnose-zai:
    concurrency:
      group: market-intelligence-zai-429-diagnostic
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: INTELIGENCI DE MERCADO API
    env:
      MI_AI_AGENTS_API_KEY: ${{ secrets.MI_AI_AGENTS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install diagnostic dependency
        run: python -m pip install httpx==0.28.1
      - name: One fixed synthetic GLM-4.7-Flash diagnostic
        run: python scripts/diagnose_zai_429.py
