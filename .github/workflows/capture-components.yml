name: Capture clean upstream baselines

on:
  push:
    paths:
      - 'components/sources.json'
      - '.github/workflows/capture-components.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-intelligence-components-baseline
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source manifest
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema_version == 1' components/sources.json >/dev/null
          jq -e '.baseline_id | length > 0' components/sources.json >/dev/null
          jq -e '.components | length > 0' components/sources.json >/dev/null
          jq -e '[.components[] | select(.enabled == true)] | length > 0' components/sources.json >/dev/null

      - name: Capture clean source archives
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .component-work component-snapshots
          mkdir -p .component-work component-snapshots components
          : > .component-work/resolved.ndjson
          : > .component-work/checksums.sha256

          baseline_id="$(jq -r '.baseline_id' components/sources.json)"
          release_tag="components-baseline-${baseline_id}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Baseline release already exists: $release_tag" >&2
            exit 1
          fi

          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            repo="$(jq -r '.repository' <<<"$item")"
            purpose="$(jq -r '.purpose' <<<"$item")"
            stage="$(jq -r '.stage' <<<"$item")"
            requested_strategy="$(jq -r '.strategy' <<<"$item")"
            resolution_strategy="$requested_strategy"

            case "$requested_strategy" in
              latest_release)
                if ref="$(gh api "repos/${repo}/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
                  resolution_strategy="latest_stable_release"
                else
                  ref="$(gh api "repos/${repo}/tags?per_page=100" --jq '[.[].name | select(test("(?i)(alpha|beta|rc|dev|preview|pre)") | not)][0]')"
                  resolution_strategy="latest_stable_tag_fallback"
                fi
                ;;
              fixed_ref)
                ref="$(jq -r '.ref' <<<"$item")"
                resolution_strategy="fixed_ref"
                ;;
              *)
                echo "Unsupported strategy for ${name}: ${requested_strategy}" >&2
                exit 1
                ;;
            esac

            if [[ -z "$ref" || "$ref" == "null" ]]; then
              echo "Could not resolve ref for ${name}" >&2
              exit 1
            fi

            commit="$(gh api "repos/${repo}/commits/${ref}" --jq '.sha')"
            safe_ref="$(printf '%s' "$ref" | tr '/ :@' '____')"
            archive="component-snapshots/${name}-${safe_ref}-source.tar.gz"

            echo "Capturing ${name}: ${repo}@${ref} (${commit}) via ${resolution_strategy}"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/tarball/${ref}" \
              --output "$archive"

            gzip -t "$archive"
            tar -tzf "$archive" >/dev/null

            license_files="$(
              tar -tzf "$archive" \
                | grep -Ei '/(LICENSE|LICENCE|COPYING|NOTICE|COPYRIGHT)([^/]*)$' \
                | head -50 \
                | jq -R -s 'split("\n") | map(select(length > 0))'
            )"

            if [[ "$(jq 'length' <<<"$license_files")" -eq 0 ]]; then
              echo "No license/notice file detected in ${name} source archive" >&2
              exit 1
            fi

            checksum="$(sha256sum "$archive" | awk '{print $1}')"
            size_bytes="$(stat -c '%s' "$archive")"
            asset_name="$(basename "$archive")"
            printf '%s  %s\n' "$checksum" "$asset_name" >> .component-work/checksums.sha256

            jq -n \
              --arg name "$name" \
              --arg repository "$repo" \
              --arg purpose "$purpose" \
              --arg stage "$stage" \
              --arg resolution_strategy "$resolution_strategy" \
              --arg ref "$ref" \
              --arg commit "$commit" \
              --arg asset "$asset_name" \
              --arg sha256 "$checksum" \
              --argjson size_bytes "$size_bytes" \
              --argjson license_files "$license_files" \
              '{
                name: $name,
                repository: $repository,
                purpose: $purpose,
                stage: $stage,
                resolution_strategy: $resolution_strategy,
                resolved_ref: $ref,
                resolved_commit: $commit,
                release_asset: $asset,
                sha256: $sha256,
                size_bytes: $size_bytes,
                license_files: $license_files
              }' >> .component-work/resolved.ndjson
          done < <(jq -c '.components[] | select(.enabled == true)' components/sources.json)

          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -s \
            --arg generated_at "$generated_at" \
            --arg baseline_id "$baseline_id" \
            --arg release_tag "$release_tag" \
            '{
              schema_version: 1,
              generated_at: $generated_at,
              baseline_id: $baseline_id,
              release_tag: $release_tag,
              clean_copy_definition: "GitHub source tarball generated from the exact resolved upstream commit/ref, with upstream files and legal notices preserved and no local modifications.",
              components: .
            }' .component-work/resolved.ndjson > components/resolved.json

          cp .component-work/checksums.sha256 components/CHECKSUMS.sha256

          {
            echo '# Baseline limpo de componentes'
            echo
            echo "Baseline: \`${baseline_id}\`"
            echo
            echo 'Os arquivos-fonte limpos são armazenados como assets da Release correspondente deste repositório. Cada pacote possui origem, tag, commit e SHA-256 registrados em `resolved.json`.'
            echo
            echo '| Componente | Estágio | Ref fixada | Commit |'
            echo '|---|---|---|---|'
            jq -r '.components[] | "| \(.name) | \(.stage) | `\(.resolved_ref)` | `\(.resolved_commit[0:12])` |"' components/resolved.json
            echo
            echo '## Verificação'
            echo
            echo 'Baixe os assets da Release e execute `sha256sum -c components/CHECKSUMS.sha256` no mesmo diretório dos pacotes.'
            echo
            echo 'Nenhum pacote deste baseline utiliza uma referência móvel `latest` depois da captura.'
          } > components/README.md

          echo "BASELINE_ID=${baseline_id}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

      - name: Commit resolved provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/resolved.json components/CHECKSUMS.sha256 components/README.md
          git commit -m "chore: lock clean component baseline ${BASELINE_ID}"
          git push origin HEAD:main

      - name: Publish clean copies as repository release assets
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh release create "$RELEASE_TAG" component-snapshots/* \
            --target "$head_sha" \
            --title "Market Intelligence AI - clean components ${BASELINE_ID}" \
            --notes "Clean upstream source snapshots for the Market Intelligence AI baseline ${BASELINE_ID}. Exact refs, commits, license files and SHA-256 checksums are recorded in components/resolved.json and components/CHECKSUMS.sha256."

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq '[.components[] | select(.enabled == true)] | length' components/sources.json)"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')"
          test "$actual" -eq "$expected"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '{tag_name, draft, prerelease, asset_count:(.assets|length)}'
