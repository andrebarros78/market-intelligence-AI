name: Remove Temporary Cleanup Branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-temporary-cleanup-branch.yml'

permissions:
  contents: write

jobs:
  remove-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete merged temporary branch
        shell: bash
        run: git push origin --delete cleanup/remove-api-ml-legacy
